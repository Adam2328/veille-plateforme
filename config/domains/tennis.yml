id: tennis
name: Tennis
accent: "#B5651D"
order: 5
quota: 8                                # moins profond que le football (demande de l'utilisateur)
max_l1: 3
thresholds: {l1: 75, l2: 65, l3: 58}   # valeurs de départ, calibrées sur les données réelles
relevance: true
rumor_markers: ["serait", "reportedly", "could withdraw", "pourrait déclarer forfait"]

exclude: ["pronostic", "cote ", "cotes ", "bookmaker", "paris sportifs", "betting", "odds", "promo code", "sponsored", "quiz", "padel", "pickleball",
          "atp 250", "wta 250", "challenger", "itf "]      # petits tournois : hors du périmètre demandé (Grands Chelems, Masters 1000, grandes finales)

entities:                               # joueurs et joueuses majeurs, tournois majeurs
  Sinner: [sinner]
  Alcaraz: [alcaraz]
  Djokovic: [djokovic]
  Zverev: [zverev]
  Medvedev: [medvedev]
  Fritz: [fritz]
  Draper: [draper]
  Rune: [rune]
  Fils: ["arthur fils"]
  Mpetshi Perricard: [mpetshi]
  Sabalenka: [sabalenka]
  Swiatek: [swiatek, świątek]
  Gauff: [gauff]
  Rybakina: [rybakina]
  Pegula: [pegula]
  Andreeva: [andreeva]
  Grands Chelems: ["grand chelem", "grand slam", "roland-garros", "roland garros", wimbledon, "us open", "open d'australie", "australian open"]
  Masters 1000: ["masters 1000", "indian wells", miami, "monte-carlo", "monte carlo", madrid, rome, "canada", montréal, toronto, cincinnati, shanghai, "paris-bercy", "rolex paris masters"]
  Finales: ["atp finals", "wta finals", "masters de fin d'année", "coupe davis", "davis cup", "billie jean king cup"]

kinds:
  final:
    weight: 25
    keywords: ["en finale", "remporte le titre", "wins title", "wins the title", "titre", sacre, sacré, sacrée, "champion", championne]   # « finale » seul retiré : il captait demi-finales et quarts
  grand_slam:
    weight: 25
    keywords: ["grand chelem", "grand slam", "roland-garros", wimbledon, "us open", "open d'australie", "australian open"]
  ranking:
    weight: 18
    keywords: [classement, ranking, "numéro 1", "world no. 1", "world number one", "no. 1"]
  injury:
    weight: 18
    keywords: [blessure, blessé, blessée, injury, injured, forfait, withdraws, withdrawal, abandon, retires]
  masters:
    weight: 15
    keywords: ["masters 1000", "atp finals", "wta finals", "indian wells", miami, "monte-carlo", madrid, rome, cincinnati, shanghai, "paris-bercy"]
  upset:
    weight: 12
    keywords: [surprise, upset, élimine, éliminé, éliminée, stuns, "knocked out", "out of"]
  retirement:
    weight: 15
    keywords: [retraite, retirement, "met un terme", "adieux", farewell]

