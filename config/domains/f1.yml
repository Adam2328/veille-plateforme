id: f1
name: F1
accent: "#C1121F"
order: 6
quota: 10
max_l1: 3
thresholds: {l1: 75, l2: 65, l3: 58}   # valeurs de départ, calibrées sur les données réelles
relevance: true
rumor_markers: ["serait", "pourrait rejoindre", "linked with", "reportedly", "in talks", "en discussions", "piste"]
explicit_rumor_markers: ["rumeur", "rumour", "rumor", "silly season"]

exclude: ["pronostic", "cote ", "cotes ", "bookmaker", "betting", "odds", "promo code", "sponsored", "quiz", "f1 25", "f1 26 game", "fantasy", "_dn-"]   # « _dn- » : pages-dossiers de RMC Sport

entities:
  Verstappen: [verstappen]
  Russell: [russell]
  Antonelli: [antonelli]
  Hamilton: [hamilton]
  Leclerc: [leclerc]
  Norris: [norris]
  Piastri: [piastri]
  Alonso: [alonso]
  Gasly: [gasly]
  Ocon: [ocon]
  Hadjar: [hadjar]
  Mercedes: [mercedes]
  Ferrari: [ferrari, "scuderia"]
  Red Bull: ["red bull"]
  McLaren: [mclaren]
  Aston Martin: ["aston martin"]
  Alpine: [alpine]
  Williams: [williams]
  Audi: [audi, sauber]
  Cadillac: [cadillac]
  FIA: [fia]

kinds:
  race_result:
    weight: 25
    keywords: [remporte, victoire, "wins the", "win in", vainqueur, winner, podium]   # « grand prix » retiré : présent dans presque tous les articles
  qualifying:
    weight: 20
    keywords: [pole, "pole position", qualifications, qualifying, "sprint"]
  penalty:
    weight: 20
    keywords: [pénalité, penalty, sanction, disqualifié, disqualified, "commissaires", stewards, "drive-through", "grid drop", "recul sur la grille"]
  transfer:
    weight: 18
    keywords: [contrat, contract, signe, signs, "rejoint", joins, "baquet", seat, "line-up", "remplacé", replaced, prolonge, extension]
  incident:
    weight: 18
    keywords: [accident, crash, collision, "drapeau rouge", "red flag", "safety car", abandon, retires, dnf, "voiture de sécurité"]
  technical:
    weight: 12
    keywords: [règlement, regulations, "moteur", engine, "power unit", aileron, upgrade, évolution, "budget cap", "plafond budgétaire"]
  championship:
    weight: 15
    keywords: [championnat, championship, "titre mondial", "world title", "leader", "points d'avance"]

