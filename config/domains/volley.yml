id: volley
name: Volley
accent: "#6A4C93"
order: 8
quota: 6                                # veille volontairement ciblée : équipes de France et grandes compétitions
max_l1: 2
thresholds: {l1: 72, l2: 60, l3: 50}   # valeurs de départ, calibrées sur les données réelles
relevance: true

# Bruit des clubs volontairement écarté (demande de l'utilisateur).
exclude: ["ligue a", "ligue as", "ligue b", "marmara", "superlega", "plusliga", "bundesliga", "coupe de france",
          "ligue des champions", "champions league", "cev cup", "challenge cup", "mercato", "transfert", "recrue",
          "pronostic", "betting", "odds", "promo code", "sponsored",
          "quelle chaîne", "chaîne tv", "en vidéo", "meilleurs moments", "à quelle heure"]      # programmes TV et vidéos : pas d'information

entities:
  Équipe de France: ["équipe de france", "les bleus", "les bleues", bleus, bleues, "france men", "france women", "french team", "team france"]
  Ngapeth: [ngapeth]
  Patry: [patry]
  Brizard: [brizard]
  Tillie: [tillie]
  Clevenot: [clevenot]
  Boyer: ["stephen boyer"]
  Bleues: ["équipe de france féminine", "volley féminin"]

kinds:
  major_event:
    weight: 25
    keywords: ["jeux olympiques", "olympic", "jo ", "championnat du monde", "world championship", "championnat d'europe", "euro de volley", eurovolley, "ligue des nations", "nations league", vnl, "la28", "la 2028", "tournoi de qualification olympique"]
  result:
    weight: 22
    keywords: [victoire, défaite, finale, final, "demi-finale", "semi-final", "s'impose", "battus", "battue", "remporte", champion, championne, médaille, medal, bronze, argent, silver, or, gold]
  team:
    weight: 15
    keywords: [sélection, sélectionneur, "liste des", convoqué, "coach", entraîneur, "head coach", capitaine]
  injury:
    weight: 12
    keywords: [blessure, blessé, blessée, injury, forfait]

